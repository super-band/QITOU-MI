name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      # 可选签名：配置 QITOU_RELEASE_KEYSTORE_BASE64 等仓库 secrets 后，
      # release APK 将用该 keystore 签名；未配置则输出未签名 release 与 debug APK。
      - name: Configure release signing (optional)
        if: ${{ secrets.QITOU_RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.QITOU_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.QITOU_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QITOU_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QITOU_RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/qitou-release.jks"
          {
            echo "storeFile=$HOME/.android/qitou-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$HOME/.android/qitou-release.properties"

      - name: Build
        run: ./gradlew :app:lintRelease :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qitou-mi-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: qitou-mi-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
