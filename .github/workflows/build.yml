name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      # 可选签名：配置 QITOU_RELEASE_KEYSTORE_BASE64 等仓库 secrets 后，
      # release APK 将用该 keystore 签名；未配置则输出未签名 release 与 debug APK。
      # 注意：GitHub Actions 的 if 条件不支持 secrets 上下文，故在脚本内判空。
      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.QITOU_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.QITOU_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QITOU_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QITOU_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore secret configured; release APK will be unsigned."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/qitou-release.jks"
          {
            echo "storeFile=$HOME/.android/qitou-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$HOME/.android/qitou-release.properties"

      - name: Build
        run: ./gradlew :app:lintRelease :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare release assets
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release-assets
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/*.apk "release-assets/QITOU-MI-$VERSION-debug.apk"
          for f in app/build/outputs/apk/release/*.apk; do
            case "$(basename "$f")" in
              *unsigned*) cp "$f" "release-assets/QITOU-MI-$VERSION-release-unsigned.apk" ;;
              *) cp "$f" "release-assets/QITOU-MI-$VERSION-release.apk" ;;
            esac
          done
          ls -la release-assets

      # main 分支每次构建自动发布/刷新 rolling release「latest」，方便直接从 Releases 页下载。
      - name: Publish rolling release (latest)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then gh release delete latest --yes; fi
          git push origin :refs/tags/latest >/dev/null 2>&1 || true
          gh release create latest \
            --target "$GITHUB_SHA" \
            --title "自动构建 #${{ github.run_number }} · ${VERSION}" \
            --notes "main 分支自动构建 · commit ${GITHUB_SHA::7} · [构建详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          安装说明：未配置 release 签名 secrets 时，请下载 -debug.apk（可直接安装）；-release-unsigned.apk 为未签名包，无法直接安装。" \
            --latest \
            release-assets/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qitou-mi-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: qitou-mi-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          generate_release_notes: true
